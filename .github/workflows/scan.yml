name: Momentum scan

# Runs only when asked (from Claude or the Actions tab). No schedule.
on:
  workflow_dispatch:
    inputs:
      top:
        description: "Rows to print"
        default: "30"

permissions:
  contents: write

concurrency:
  group: momentum-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the math
        run: python test_momentum_core.py
      - name: Scan the S&P 1500
        run: |
          python momentum_scan.py --universe sp1500 --top "${{ inputs.top }}" --cache-ttl 0 > results/latest.md
          cat results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ universe/
          git diff --cached --quiet || git commit -m "Momentum scan results $(date -u +%F)"
          git push
